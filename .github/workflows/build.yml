
name: Extract ZIP and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FG.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FG ZIP
        run: |
          mkdir extracted
          unzip -o FG.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Kotlin JVM Target
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          cat >> "$FILE" <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Assistant-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
